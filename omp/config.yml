symbolPreset: unicode
theme: 
  dark: titanium
setupVersion: 1
statusLine: 
  preset: default
  compactThinkingLevel: false
  showHookStatus: true
  sessionAccent: true
  transparent: false
terminal: 
  showProgress: false
tui: 
  textSizing: false
  tight: false
defaultThinkingLevel: high
tier: 
  openai: none
  anthropic: none
advisor: 
  enabled: true
  subagents: false
  syncBacklog: "off"
github: 
  enabled: true
task: 
  eager: always
  showResolvedModelBadge: true
  softRequestBudget: 200
  softRequestBudgetNotice: true
  batch: true
  enableLsp: true
  maxConcurrency: 16
  maxRecursionDepth: 3
modelRoles: 
  smol: openai-codex/gpt-5.6-luna
  advisor: anthropic/claude-opus-5:medium
  designer: anthropic/claude-opus-5:medium
  plan: anthropic/claude-opus-5:max
  commit: openai-codex/gpt-5.6-luna:high
  task: openai-codex/gpt-5.6-sol:high
  vision: anthropic/claude-opus-5:high
  tiny: openai-codex/gpt-5.6-luna:high
  default: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:max
display: 
  shimmer: classic
  showTokenUsage: true
providers: 
  anthropic: 
    serverSideFallback: false
  fetch: jina
  webSearchOrder: 
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
retry: 
  fallbackChains: 
    default: 
      - anthropic/claude-opus-5:medium
      - openai-codex/gpt-5.6-sol:high
    advisor: 
      - openai-codex/gpt-5.6-sol:high
    slow: 
      - openai-codex/gpt-5.6-sol:high
    designer: 
      - openai-codex/gpt-5.6-sol:high
    openai-codex/gpt-5.6-luna: 
      - openai-codex/gpt-5.6-sol:medium
      - anthropic/claude-opus-5:medium
    openai-codex/gpt-5.6-sol: 
      - anthropic/claude-opus-5:medium
    anthropic/claude-opus-5: 
      - openai-codex/gpt-5.6-sol:high
omitThinking: false
includeWorkspaceTree: false
autocompleteMaxVisible: 10
emojiAutocomplete: true
branchSummary: 
  enabled: true
readLineNumbers: false
commands: 
  enableOpencodeProject: false
  enableOpencodeUser: false
steeringMode: all
interruptMode: immediate
dev: 
  autoqa: false
  autoqaConsent: denied
compaction: 
  idleEnabled: true
  handoffSaveToDisk: true
doubleEscapeAction: tree
hideThinkingBlock: false
autoResume: false
textVerbosity: low
features: 
  unexpectedStopDetection: true
codexResets: 
  autoRedeem: "no"
startup: 
  quiet: true
  changelogMode: summary
tools: 
  approvalMode: yolo